name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping sewasetu
        run: |
          for path in / /healthz /mcp/citizen /mcp/officer /.well-known/oauth-protected-resource/mcp/citizen; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "https://sewasetu-a96o.onrender.com$path")
            echo "$path -> $code"
          done
